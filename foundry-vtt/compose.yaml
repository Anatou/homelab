# From https://github.com/felddy/foundryvtt-docker
services:
  foundry:
    image: ghcr.io/felddy/foundryvtt:latest
    hostname: foundry-vtt # used for validating the software licence, do not change it
    volumes:
      - type: bind
        source: ./foundry
        target: /data
    environment:
      - FOUNDRY_TELEMETRY=true
      - CONTAINER_PRESERVE_CONFIG=true
    env_file:
      - .env
    ports:
      - target: 30000
        published: 30000
        protocol: tcp
  filebrowser:
    image: gtstef/filebrowser:latest
    env_file:
      - .env
    environment:
      FILEBROWSER_CONFIG: "data/quantum.yaml" 
      TZ: "Europe/Paris"
    volumes:
      - ./foundry:/folder 
      - ./quantum.yaml:/home/filebrowser/data/quantum.yaml
    ports:
      - 8000:80
    restart: unless-stopped
